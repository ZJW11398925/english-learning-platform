<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>英语学习 · 场景取词</title>
  <meta name="description" content="拍一件身边的东西，学一个能指着说的英文词：识物取词 → 跟读 → 自己造句 → 拿到结构化反馈。">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <!-- 加到主屏后按独立应用运行（地址栏不占高度），这是"像一个 App"的第一层 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <!--
    只有浏览器会执行这段内联 module：`mount()` 里的 DOM 代码因此永远不在 app.mjs 的模块顶层跑，
    测试才能在 Node 里直接 import 入口模块。没有外部资源（无 CDN/字体），
    内网穿透的 HTTPS 地址下不会因为外站不可达而白屏。
  -->
  <script type="module">
    import { mount } from './app.mjs';

    mount(document.getElementById('app')).catch((err) => {
      console.error('mount 失败：', err);
    });
  </script>
</body>
</html>
