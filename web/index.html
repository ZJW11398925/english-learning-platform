<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>英语学习 · 场景取词</title>
  <style>
    :root { color-scheme: light dark; --gap: 12px; }
    body {
      margin: 0;
      padding: 0;
      /* 刘海屏/小白条留白；不支持 env() 的浏览器会忽略这一行，退回上面的 padding: 0 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #app { padding: 16px; max-width: 560px; margin: 0 auto; }
    h2 { font-size: 1.15rem; }
    video, img { width: 100%; border-radius: 12px; background: #000; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; border-radius: 10px; }
    button { font-size: 1.05rem; padding: 12px 18px; border-radius: 10px; }
    .row { display: flex; gap: var(--gap); flex-wrap: wrap; margin-top: 12px; }
    .muted { opacity: .7; font-size: .9rem; }
    .error { color: #b3261e; font-size: .95rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <!--
    只有浏览器会执行这段内联 module：`mount()` 里的 DOM 代码因此永远不在 app.mjs 的模块顶层跑，
    测试才能在 Node 里直接 import 入口模块。没有外部资源（无 CDN/字体），
    内网穿透的 HTTPS 地址下不会因为外站不可达而白屏。
  -->
  <script type="module">
    import { mount } from './app.mjs';

    mount(document.getElementById('app')).catch((err) => {
      console.error('mount 失败：', err);
    });
  </script>
</body>
</html>
