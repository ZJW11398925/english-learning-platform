<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>界面走查台 · 英语学习 场景取词</title>
  <!-- 内联 data URI 图标：只为消掉浏览器那次 favicon 404（零外部资源，见 styles.css 的口径） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f766e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="gallery">
  <!--
    ⚠️ 这是**开发用的界面走查台**，不是产品页面（产品页是 index.html）。

    它存在的理由（对应 frontend-dev-playbook 的 Phase 1/4）：改样式必须先能**反复看到**
    每一个屏与每一个档位——否则"我只能确认首页长得还行"就是全部证据。这里用
    **注入的假依赖**把真实 app.mjs 挂起来，于是：

      · 不花一次模型调用（识物与造句都是注入的假实现，结构上打不到 api.deepseek.com）；
      · 每个档位都可复现（数据写死在下面，不看真机状态）；
      · 渲染的是**生产那份 app.mjs**——不是另画一套假界面，所以它不会与线上漂移。

    ── 两种驱动方式的区别（TASK-…b3.54 起）──────────────────────────────────
    1. **假存储 / 假 fetch**（ready / ready-due / pending / settings）：只把"数据现场"摆好，
       应用自己渲染出来。惰性 fetch（永不 resolve）既不发请求也不触发错误分支。
    2. **驱动真实链路**（capturing / word / composing / feedback / reading / done）：
       这些档位在真机上是**用户点出来的**，所以走查台也**点真实按钮**——假的只是依赖
       （假 camera / 假识物器 / 假造句器 / 假相册），界面与状态机转移全部是生产代码。
       于是"这一段样式在真机上会不会溢出"的问题，答案就是在真链路的那一屏上量到的。

    假数据的形状逐字对齐 `units/pending.mjs`（pendingFeedbackQueue）与
    `units/scheduler.mjs`（dueWords：isMaintained 为假、dueAt 是有限数且 ≤ now）——
    形状写错的话这一屏会**静默变空**，于是走查台自己先失真。

    用法：`gallery.html?scenario=<名>&key=set|unset`
      home | home-due | review                        ← 阶段 A 新增（首页 / 首页+到期词 / 复习页）
      ready | ready-due | pending | pending-empty | settings | capturing |
      capturing-manual | word | reading | composing | feedback | done

    ── 阶段 A：应用有了底部页签（默认落在「首页」）──────────────────────────────
    取词那一条线性流程搬进了「学习」页签，所以**渲染学习页那一屏的档位都要先导航**
    （`ON_LEARN` 那一组）。导航走的是**真实按钮**（`<nav>` 里的页签），与用户点的是同一颗；
    取页签用**精确文案 + 限定在 `<nav>` 里**——首页那颗大字入口叫「开始学习」，
    它包含「学习」二字，`includes` 匹配会选错（`tests/helpers/mount-harness.mjs` 的
    `gotoLearn` 同一个理由）。
  -->
  <div id="app"></div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const scenario = params.get('scenario') ?? 'ready';
    const keyMode = params.get('key') ?? 'set';   // set | unset

    const HOUR = 3600000;
    const DAY = 86400000;
    const now = Date.now();
    const SESSION = 'gallery-session-1';

    /** 需要"走完半条真实链路"的档位（下面按它决定注入哪套假依赖、点哪些按钮）。 */
    const DRIVEN = new Set([
      'capturing', 'capturing-manual', 'word', 'reading', 'composing', 'feedback', 'done',
    ]);

    /**
     * 渲染**学习页**上某一屏的档位（阶段 A：应用默认落在首页，这些屏现在在第二个页签上）。
     * 不先导航的话走查台会在首页上找不到「拍照」并响亮失败（`clickButton` 的说明）。
     */
    const ON_LEARN = new Set([
      'ready', 'ready-due', 'pending', 'pending-empty',
      'capturing', 'capturing-manual', 'word', 'reading', 'composing', 'feedback', 'done',
    ]);

    /** 要摆"有到期词"现场的档位（`dueWords` 的 shapes 见 units/scheduler.mjs 的文件头）。 */
    const DUE_SCENARIOS = new Set(['ready-due', 'home-due', 'review']);
    /** 要摆"有待补欠账"现场的档位（`pending-empty` 只摆 compose_submitted、不摆欠账）。 */
    const PENDING_SCENARIOS = new Set(['pending', 'pending-empty', 'review']);

    // ── 假存储：形状照 units/store.mjs 的键名与 units/event-log.mjs 的 REQUIRED ──
    const events = [];
    const words = {};
    let key = null;

    if (keyMode === 'set') key = 'sk-gallery-demo-key-not-real-000000000000';

    if (DUE_SCENARIOS.has(scenario)) {
      // 三个词到期，最早的一个在 2 天前——复现提示要显示"上次是在「厨房」场景学的"。
      words.mug = {
        id: 'mug', label: 'mug', scene: 'kitchen', stage: 0,
        dueAt: now - 2 * DAY, lastScene: 'kitchen', createdAt: now - 3 * DAY,
      };
      words.kettle = {
        id: 'kettle', label: 'kettle', scene: 'kitchen', stage: 1,
        dueAt: now - 6 * HOUR, lastScene: 'kitchen', createdAt: now - 5 * DAY,
      };
      words.umbrella = {
        id: 'umbrella', label: 'umbrella', scene: 'street', stage: 1,
        dueAt: now - 1 * HOUR, lastScene: 'street', createdAt: now - 4 * DAY,
      };
    }

    if (PENDING_SCENARIOS.has(scenario)) {
      events.push({
        ts: now - 3 * HOUR,
        type: 'compose_submitted',
        wordId: 'mug',
        sessionId: SESSION,
        roundIndex: 1,
        payload: { sentence: 'I very like my mug.', word: 'mug', scene: 'kitchen' },
      });
      if (scenario !== 'pending-empty') {
        events.push({
          ts: now - 3 * HOUR + 40,
          type: 'feedback_pending',
          wordId: 'mug',
          sessionId: SESSION,
          roundIndex: 1,
          payload: {
            pendingId: 'pend-1',
            sentence: 'I very like my mug.',
            word: 'mug',
            scene: 'kitchen',
            reason: 'timeout',
          },
        });
      }
      // 第二条欠账只在 pending 那一档里（review 需要的是"有欠账"这一件事，不必两条）
      if (scenario === 'pending') {
        events.push({
          ts: now - 2 * HOUR,
          type: 'compose_submitted',
          wordId: 'kettle',
          sessionId: SESSION,
          roundIndex: 2,
          payload: { sentence: 'The kettle is boiling already.', word: 'kettle', scene: 'kitchen' },
        });
        events.push({
          ts: now - 2 * HOUR + 40,
          type: 'feedback_pending',
          wordId: 'kettle',
          sessionId: SESSION,
          roundIndex: 2,
          payload: {
            pendingId: 'pend-2',
            sentence: 'The kettle is boiling already.',
            word: 'kettle',
            scene: 'kitchen',
            reason: 'network',
          },
        });
      }
    }

    const fakeStorage = {
      getItem: (k) => {
        if (k === 'elp.events') return JSON.stringify(events);
        if (k === 'elp.words') return JSON.stringify(words);
        if (k === 'elp.apiKey') return key;
        return null;
      },
      setItem: () => {},
      removeItem: () => {},
    };

    // 假 fetch：**永不 resolve 也永不 reject**。
    //
    // 为什么不是"抛错"：app.mjs 有**自动补交重试**，抛错会被真实链路接住并渲染出
    // 「补交时出错…」错误条——那条横幅是真的，但它是**走查台自己造成的**，
    // 会让每一张截图都带着一个与界面无关的红框。永远 pending 则既不发请求（结构上不可能花钱），
    // 也不触发任何错误分支，走查台看到的才是界面本来该有的样子。
    const inertFetch = () => new Promise(() => {});

    // ── 驱动档位用的假依赖（**假的是依赖，不是界面**）────────────────────────────
    //
    // 下面每一个都只替换"外界"，不替换 app.mjs：状态机转移、DOM 结构、渲染时机全部是生产代码。
    // 于是这些屏与真机上那一屏的差别只有"帧从哪来""模型答了什么"，没有一处界面差异。

    /** 一帧假照片：4:3 的合成图（**不是**任何真实物体的照片，只是让 word 屏的冻结帧有个尺寸）。 */
    const FAKE_FRAME_URL = 'data:image/svg+xml;charset=utf-8,'
      + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480">'
        + '<rect width="640" height="480" fill="#cfc7ba"/>'
        + '<text x="320" y="250" font-size="26" fill="#6b6155" text-anchor="middle">'
        + 'gallery fake frame 640x480</text></svg>',
      );

    /**
     * 造一个**真的 MediaStream**（假 canvas 的 captureStream）。
     *
     * 为什么不用 `{ getTracks() {...} }` 这种朴素替身：`video.srcObject` 是
     * **有类型检查的 WebIDL 属性**，赋一个非 MediaStream 会抛
     * `TypeError: The provided value is not of type '(MediaSourceHandle or MediaStream)'`
     * ——那次赋值就在 `openCamera` 里，于是整条"拍照"路径当场断在相机那一格
     * （首版真踩了：界面显示"相机打不开"，走查台自己失真）。
     * 真浏览器里 `canvas.captureStream()` 可用；万一不可用就退回一个空对象让赋值失败，
     * 由走查台**响亮**报错，而不是静默画出一个假界面。
     */
    const makeFakeStream = () => {
      const c = document.createElement('canvas');
      c.width = 640;
      c.height = 480;
      if (typeof c.captureStream !== 'function') return {};
      const s = c.captureStream(0);   // 0 fps：只要一个类型正确的流，不需要它真的出画
      return s;
    };

    /**
     * 假相机：`openCamera` 只把假流挂上去（不碰 getUserMedia → 不需要授权、不需要安全上下文），
     * `grabFrame` 回一帧真 Blob（形状与 `camera.grabFrame` 一致）。
     */
    const fakeCamera = {
      VIDEO_NOT_READY: 'VIDEO_NOT_READY',
      async openCamera(video) {
        video.srcObject = makeFakeStream();
        // 8fps 的假流不保证立刻可播：`play()` 可能一直 pending 或拒绝。都不影响走查台的用途
        // （video 元素本身就是那张"预览"卡片的尺寸），所以**不 await**，也绝不因此中断链路。
        try { video.play()?.catch?.(() => {}); } catch { /* 同上 */ }
        return video.srcObject;
      },
      async grabFrame() {
        return {
          blob: new Blob([new Uint8Array(9)], { type: 'image/jpeg' }),
          stats: { brightness: 128, laplacianVar: 200 },
        };
      },
    };

    /** 对象 URL：回上面那张合成图（真 `URL.createObjectURL` 也能用，但截图会是一块纯色）。 */
    const fakeUrlApi = { createObjectURL: () => FAKE_FRAME_URL, revokeObjectURL: () => {} };

    /** 假识物器 · 一次命中：形状与 `recognizeWithFallback` 的 mode:'ok' 返回值一致。 */
    const okRecognize = async () => ({
      mode: 'ok',
      word: 'mug',
      candidates: [
        { label: 'mug', score: 0.9, scene: 'kitchen' },
        { label: 'cup', score: 0.4, scene: 'kitchen' },
      ],
      attempts: 1,
      latencyMs: 1860,
    });

    /** 假识物器 · 两轮都落空 → 降级到手选场景词（mode:'manual'，界面上一个英文词都不许出现）。 */
    const manualRecognize = async () => ({
      mode: 'manual',
      word: null,
      candidates: [{ label: 'container', score: 0.95, scene: 'kitchen' }],
      attempts: 2,
      reason: 'not_in_acceptable_set',
      detail: '模型候选 container 无一命中可接受集',
    });

    /**
     * 假识物器 · **永不返回**：只用来把状态机停在 `capturing` 那一屏。
     *
     * 为什么需要它：真实链路里"按了快门"之后 `capturing` 那一屏只存在到结论落地为止
     * （本地假识物器是微秒级返回），所以想截到它就得让识物那一腿**不走完**——
     * 这正是弱网/慢模型下的真实情形（用户在快门屏上等）。这不是伪造状态：
     * 状态机、DOM、按钮全是生产代码，假的只是"模型还没回话"。
     */
    const hangRecognize = () => new Promise(() => {});

    /**
     * 假造句器：直接回一份**过得了 `validateFeedback`** 的四字段判定（flawed / 词选不准）。
     * 这不是"为了截图好看"编的——真链路的 ok 档就是这个形状，`status:'ok'` 的语义由
     * `units/feedback.mjs` 的校验器定义，走查台不替它放宽。
     */
    const fakeSubmitSentence = async ({ sentence, word, scene }) => ({
      status: 'ok',
      feedback: {
        verdict: 'flawed',
        error_type: 'word_choice',
        rewrite: 'I put my mug on the desk.',
        note: 'mug 是马克杯；这句话里用 cup 更贴切。',
      },
      uncertain: false,
      sentence,
      word,
      scene,
    });

    const { mount } = await import('./app.mjs');
    // 手选词包**与生产同源**（不另抄一份）：形状与装配层的缺省来源一致，
    // 于是"界面上列了哪些词"这件事不会在走查台与线之间漂移。
    const { MANUAL_PICK_SCENE_WORDS } = await import('./units/recognize.mjs');

    const root = document.getElementById('app');

    const recognize = scenario === 'capturing-manual'
      ? manualRecognize
      : scenario === 'capturing'
        ? hangRecognize          // 永不返回 → 状态机停在 capturing（见那里的说明）
        : okRecognize;
    const driven = DRIVEN.has(scenario);

    await mount(root, {
      keyring: (await import('./units/keyring.mjs')).createKeyring({ storage: fakeStorage }),
      store: (await import('./units/store.mjs')).createStore({ localStorage: fakeStorage, indexedDB: null }),
      // 未走链路的档位：惰性 fetch（既不花钱也不出错）。
      recognizeWithFallback: driven ? recognize : inertFetch,
      manualSceneWords: driven ? MANUAL_PICK_SCENE_WORDS : null,
      compose: { submitSentence: driven ? fakeSubmitSentence : inertFetch },
      // 相册与帧质检都注入假实现：一次真实 import 都不发生（走查台不该碰真解码）。
      album: { IMAGE_NOT_READABLE: 'IMAGE_NOT_READABLE', frameFromImageFile: inertFetch },
      camera: driven ? fakeCamera : null,
      urlApi: driven ? fakeUrlApi : null,
    });

    /**
     * 按**文案**点一颗按钮（与用户点的是同一颗；找不到就响亮失败，不静默跳过）。
     * `textContent.includes` 而不是全等：按钮文案里有全角括号与省略号，全等太脆。
     *
     * ⚠️ 阶段 A 起**页签不许用这个函数点**：首页那颗大字入口叫「开始学习」，
     * 它包含「学习」二字 ⇒ `clickButton('学习')` 会点到首页的入口而不是页签。
     * 页签一律走 `tabButton()`（限定在 `<nav>` 里 + 全等）。
     */
    const clickButton = (needle) => {
      const b = [...root.querySelectorAll('button')].find((x) => x.textContent.includes(needle));
      if (!b) throw new Error(`走查台找不到按钮「${needle}」（当前状态：${root.textContent.slice(0, 80)}）`);
      b.click();
      return b;
    };

    /** 等一次异步渲染落地（假造句器是 async 的：结论回到界面前会先渲染"正在看你这句"）。 */
    const settle = async (needle) => {
      for (let i = 0; i < 200; i += 1) {
        if (root.textContent.includes(needle)) return;
        await new Promise((r) => setTimeout(r, 5));
      }
      throw new Error(`走查台等不到「${needle}」`);
    };

    /** 底部页签里的某一枚（**精确文案 + 只在 `<nav>` 里找**；理由见 `clickButton` 的说明）。 */
    const tabButton = (label) => {
      const nav = root.querySelector('nav.tabbar');
      if (!nav) throw new Error('走查台：界面上没有底部页签（阶段 A 的应用骨架）');
      const tabs = [...nav.querySelectorAll('button')];
      if (tabs.length !== 4) throw new Error(`走查台：底部页签应当是四枚，实测 ${tabs.length} 枚`);
      const b = tabs.find((x) => x.textContent === label);
      if (!b) throw new Error(`走查台：底部页签里没有「${label}」`);
      return b;
    };

    /** 切到「学习」页签（点的是真实页签按钮，与用户点的是同一颗）。 */
    const gotoLearn = async () => {
      tabButton('学习').click();
      await settle('拍一件你身边的东西');     // ready 屏的标题：到了学习页才算就位
    };

    /** 切到「设置」页签（阶段 A 起设置既是抽屉也是页签；这一档走页签那条路）。 */
    const gotoSettings = async () => {
      tabButton('设置').click();
      await settle('设置 · API Key');
    };

    // ── 导航到目标档位所在的页签（阶段 A：应用默认落在首页）───────────────────────
    // ⚠️ 顺序有讲究：这几句必须写在上面那些 `const` 助手**之后**（`const` 有 TDZ，
    // 提前调用会当场 ReferenceError）。
    if (scenario === 'settings') {
      // 这一档走**设置页签**那条路（它同时仍能从每屏都挂的「设置（API Key）」入口打开，
      // 两条路进入的是同一屏；页签那条路的「返回」回到进来时待着的那一页）。
      await gotoSettings();
    } else if (scenario === 'review') {
      // 复习页是第三枚页签（阶段 A 新增档位）：点真实页签过去，判据是它独有的出口按钮。
      tabButton('复习').click();
      await settle('去学习');
    } else if (ON_LEARN.has(scenario)) {
      // 这些档位渲染的都是**学习页**上的某一屏 ⇒ 先导航（否则下面在首页上找不到「拍照」）。
      await gotoLearn();
    }
    // `home` 那一档**不做任何导航**：它存在的意义正是"证明应用默认落在首页"。

    if (scenario === 'pending' || scenario === 'pending-empty') {
      // 待补那一屏是"任一屏都能打开的一个抽屉"，所以要按它的入口按钮进去。
      const entry = [...root.querySelectorAll('button')]
        .find((b) => b.textContent.includes('待补'));
      if (entry) entry.click();
    }

    // ── 走真实链路到目标档位（每一步都是真按钮）─────────────────────────────────
    /** 手选档（两轮都落空）停在 capturing，其余驱动档位都取到词、进 word。 */
    const manualScenario = scenario === 'capturing-manual';

    /**
     * 各档位"已到达"的判据（截图脚本按它等，而不是按固定时长）。
     *
     * 为什么需要它：`capturing` 那一档的识物腿是**永不返回**的，所以"挂好了"这件事
     * 不能靠一个统一的 ready 标志——必须按**这一屏应该出现的内容**判。
     * 判据全部是用户能看到的字，不是内部状态（改文案时这里要跟着改，与
     * `tests/helpers/mount-harness.mjs` 的 `FEEDBACK_BUSY_MARK` 同一种做法）。
     */
    const ARRIVED = {
      home: '拍一下，学一个词',              // 阶段 A 新增：首页那一屏（空词表 → 空状态）
      'home-due': '最先到期的是',            // 阶段 A 新增：首页 + 有到期词（到期卡片 + 已学词概览）
      review: '去学习',                     // 阶段 A 新增：复习页独有的出口按钮（别的屏没有这三个字）
      ready: '拍一件你身边的东西',
      'ready-due': '该复习了',
      // 判据取抽屉里的**正文**而不是入口按钮上的「待补反馈」（后者在抽屉没打开时也成立，
      // 那样这条判据就分不出"入口在"与"抽屉真的开了"）。
      pending: '这些句子当时没拿到判定',
      // ⚠️ 如实说明这一档的现状（阶段 A 顺手把它写清楚，不改行为）：`pending-empty`
      // **看不到"空的待补抽屉"**——入口按钮只在真有欠账时才渲染（`openCount > 0 ||
      // archivedTotal > 0`，那是 `app.mjs` 的明文口径：一个永远挂着"待补反馈（0 条）"的
      // 按钮只会让人以为出了事）。只有 `compose_submitted`、没有 `feedback_pending` 时
      // 队列其实是空的，于是这一档实际落在**学习页的 ready 屏**上。
      // 所以判据按**实际**到达的那一屏写，并在 `data-gallery-arrived` 上如实报它，
      // 而不是留一个永远为 null 的判据（那正是 AGENTS.md 里记着的那条旧缺口）。
      'pending-empty': '拍一件你身边的东西',
      settings: '设置 · API Key',
      capturing: '对准物体，按「快门」',
      'capturing-manual': '没能自动认出这个词',
      word: '我会读了（开始跟读）',
      reading: '跟读一遍',
      composing: '用这个词写一句你自己的话',
      feedback: '你写的是',
      done: '这一个词走完了',
    };
    const mark = (name) => { document.body.dataset.galleryScenario = name; };

    if (driven) {
      await clickButton('拍照');            // ready → capturing（真状态机；页签已在上面切好）
      await clickButton('快门');            // 取帧 → 假识物器（capturing 那一档永不回话）
      if (scenario === 'capturing') {
        // 停在"识物还没回话"的现场（见 hangRecognize 的说明）。这里是**同步**渲染出来的，
        // 不需要等异步结论——认一下这一屏到了就算就位。
        await settle('对准物体，按「快门」');
      } else {
        // 等**这一次取词的结论**渲染出来：手选档等"再拍一张"（那一格的两个选择之一），
        // 其余等词卡标题（`mug`）。等错了会在这里响亮失败，不会静默拍一张过渡态。
        await settle(manualScenario ? '再拍一张' : 'mug');
      }

      if (scenario === 'capturing' || scenario === 'word' || manualScenario) {
        // 就停在这里（capturing，或 word，或 capturing+手选词包）。
      } else {
        await clickButton('我会读了');     // word → reading
        if (scenario !== 'reading') {
          await clickButton('跳过跟读');   // reading → composing
          // 造句屏要提交才拿得到反馈，所以除了"停在 composing"这一档，其余三档
          // 都先把句子**真的写进 textarea**（截图里那一行是真实输入框的内容，不是画上去的；
          // 量它的高度时量的就是真输入框）。顺序不能颠倒：`onSubmit` 读的就是此刻的 value。
          if (scenario !== 'composing') {
            const box = root.querySelector('textarea');
            if (!box) throw new Error('走查台：造句屏上没有 textarea');
            box.value = 'I very like my mug.';
          }
          if (scenario === 'composing') {
            // 停在造句屏。
          } else {
            await clickButton('提交造句');  // composing → feedback
            await settle('你写的是');       // 等假造句器的结论落到界面（不是等固定时长）
            if (scenario === 'done') await clickButton('下一个词');
          }
        }
      }
      mark(scenario);
    } else {
      // "只摆数据现场"的档位：mount 之后就位（页签已切好、抽屉入口已点）。
      // 阶段 A 新增的 `home` / `review` 也走这一支（它们不驱动链路，只摆数据）。
      mark(scenario);
    }

    document.body.dataset.galleryReady = 'true';
    if (root.textContent.includes(ARRIVED[scenario] ?? '\u0000')) {
      document.body.dataset.galleryArrived = scenario;
    }
  </script>
</body>
</html>
